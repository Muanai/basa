name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Install dependencies
        run: uv sync --extra dev
        
      - name: Ruff Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Type Check
        run: uv run mypy --strict src/basa

      - name: Run Tests with Coverage
        run: uv run pytest --cov=basa -m "not slow"

      - name: Run Performance & Slow Tests
        run: uv run pytest -m slow

      - name: Build Package
        run: uv build

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv sync

      - name: Run BASA Evals Release Gate (pilot_210)
        run: uv run --with "basa-evals>=0.1.1" basa-eval run --suite pilot_210 --system basa-full --output "${{ runner.temp }}/pilot_210.json"