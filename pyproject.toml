[project]
name = "basa"
version = "0.2.0"
description = "Modern NLP preprocessing for Indonesian and regional languages — normalizes slang, abbreviations, and noisy social media text."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Muanai Khalifah Revindo", email = "muanaikhalifahr@gmail.com"}
]
keywords = [
    "nlp",
    "indonesian",
    "bahasa",
    "text-preprocessing",
    "text-normalization",
    "tokenization",
    "slang",
    "social-media",
    "natural-language-processing",
    "bahasa-indonesia",
    "malay",
    "regional-languages",
]
classifiers = [
    # Development Status
    "Development Status :: 3 - Alpha",

    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",

    # Topic
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",

    # License
    "License :: OSI Approved :: MIT License",

    # Programming Language — these generate PyPI version badges
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",

    # Operating System
    "Operating System :: OS Independent",

    # Natural Language
    "Natural Language :: Indonesian",

    # Typing
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Muanai/basa"
Documentation = "https://muanai.github.io/basa"
Repository = "https://github.com/Muanai/basa"
Issues = "https://github.com/Muanai/basa/issues"
Changelog = "https://github.com/Muanai/basa/blob/main/docs/changelog.md"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-ask-ai>=1.1.3",
    "mike>=2.1.0",
    "pydantic>=2.0.0"
]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0"
]
evaluation = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "seqeval>=1.2.2"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
markers = [
    "slow: marks slow scaling and cross-process tests (deselect with '-m \"not slow\"')",
]
